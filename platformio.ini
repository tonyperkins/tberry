; tdeck-hello — minimal bring-up firmware for the LilyGO T-Deck Plus.
; Proves display, touch, keyboard, trackball, SD and LoRa radio before any UI work.
; Build: pio run -e tdeck   Flash: pio run -e tdeck -t upload

[env:tdeck]
; Pinned: unpinned `espressif32` resolves to a newer SDK without Bluedroid/Arduino 2.x.
platform  = espressif32@6.12.0
board     = esp32-s3-devkitm-1
framework = arduino

board_build.flash_size  = 16MB
board_build.flash_mode  = dio
board_build.partitions  = default_16MB.csv
board_upload.flash_size = 16MB
board_build.f_cpu       = 240000000L
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed  = 921600

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM=1
  -DCORE_DEBUG_LEVEL=1
  ; TFT_eSPI setup (no User_Setup.h)
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DUSE_FSPI_PORT
  -DTFT_INVERT_COLORS
  ; native portrait size; setRotation(1) makes it 320x240 landscape
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DCGRAM_OFFSET=1
  -DTFT_CS=12
  -DTFT_DC=11
  -DTFT_RST=-1
  -DTFT_BL=42
  -DTFT_MOSI=41
  -DTFT_MISO=38
  -DTFT_SCLK=40
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  ; display runs SPI mode 3, radio and SD mode 0: transactions switch between them
  -DSUPPORT_TRANSACTIONS
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=6000000

lib_deps =
  bodmer/TFT_eSPI@^2.5.34
  jgromes/RadioLib@^7.6.0
