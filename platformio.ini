; tdeck-os: standalone MeshCore messenger firmware for the LilyGO T-Deck Plus.
; Build: pio run -e tdeck      Flash: pio run -e tdeck -t upload
; MeshCore is used unmodified, via lib/MeshCore (symlink to a clean clone).

[env:tdeck]
; Pinned: an unpinned `espressif32` resolves to a newer SDK without the Arduino 2.x API.
platform  = espressif32@6.12.0
board     = esp32-s3-devkitm-1
framework = arduino

board_build.flash_size  = 16MB
board_build.flash_mode  = dio
board_build.partitions  = default_16MB.csv
board_upload.flash_size = 16MB
board_build.f_cpu       = 240000000L
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed  = 921600

lib_extra_dirs = lib/MeshCore/lib
lib_ldf_mode = deep+

build_flags =
  -w -DNDEBUG
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM=1
  -DCORE_DEBUG_LEVEL=1
  -DESP32_PLATFORM
  -I lib/MeshCore/lib/ed25519
  -I include
  ; --- TFT_eSPI (no User_Setup.h). Native portrait size; rotation 1 gives 320x240 ---
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DUSE_FSPI_PORT
  -DTFT_INVERT_COLORS
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DCGRAM_OFFSET=1
  -DTFT_CS=12
  -DTFT_DC=11
  -DTFT_RST=-1
  -DTFT_BL=42
  -DTFT_MOSI=41
  -DTFT_MISO=38
  -DTFT_SCLK=40
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  ; display runs SPI mode 3, radio and SD mode 0: transactions switch between them
  -DSUPPORT_TRANSACTIONS
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=6000000
  ; --- MeshCore / radio (values from MeshCore's lilygo_tdeck variant) ---
  -DRADIOLIB_STATIC_ONLY=1
  -DRADIOLIB_GODMODE=1
  -DRADIOLIB_EXCLUDE_CC1101=1
  -DRADIOLIB_EXCLUDE_RF69=1
  -DRADIOLIB_EXCLUDE_SX1231=1
  -DRADIOLIB_EXCLUDE_SI443X=1
  -DRADIOLIB_EXCLUDE_RFM2X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_AFSK=1
  -DRADIOLIB_EXCLUDE_AX25=1
  -DRADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -DRADIOLIB_EXCLUDE_MORSE=1
  -DRADIOLIB_EXCLUDE_APRS=1
  -DRADIOLIB_EXCLUDE_RTTY=1
  -DRADIOLIB_EXCLUDE_SSTV=1
  -DRADIOLIB_EXCLUDE_BELL=1
  -DRADIOLIB_EXCLUDE_LORAWAN=1
  -DRADIOLIB_EXCLUDE_FSK4=1
  -DRADIOLIB_EXCLUDE_PAGER=1
  -DUSE_SX1262
  -DLORA_FREQ=910.525
  -DLORA_BW=62.5
  -DLORA_SF=7
  -DLORA_CR=5
  -DLORA_TX_POWER=22
  -DSX126X_DIO2_AS_RF_SWITCH=false
  -DSX126X_CURRENT_LIMIT=140
  -DSX126X_RX_BOOSTED_GAIN=1
  -DSX126X_DIO3_TCXO_VOLTAGE=1.8f
  -DP_LORA_DIO_1=45
  -DP_LORA_NSS=9
  -DP_LORA_RESET=17
  -DP_LORA_BUSY=13
  -DP_LORA_SCLK=40
  -DP_LORA_MISO=38
  -DP_LORA_MOSI=41
  -DMAX_CONTACTS=100
  -DMAX_GROUP_CHANNELS=8

lib_deps =
  SPI
  Wire
  bodmer/TFT_eSPI@^2.5.34
  jgromes/RadioLib@^7.6.0
  rweather/Crypto@^0.4.0
  adafruit/RTClib@^2.1.3
  electroniccats/CayenneLPP@1.6.1
  densaugeo/base64@~1.4.0
  ed25519
